<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - Столовая</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/config.js"></script>
    <style>
        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            margin-bottom: 30px;
            font-size: 16px;
            transition: var(--transition);
        }
        
        .back-link:hover {
            color: var(--accent-green);
            gap: 12px;
        }
        
        .profile-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }
        
        .profile-sidebar {
            background: var(--bg-medium);
            border-radius: 25px;
            padding: 40px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--accent-green), #7AE553);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: var(--bg-dark);
            margin: 0 auto 20px;
        }
        
        .profile-name {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .profile-email {
            text-align: center;
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-item {
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-gray);
        }
        
        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .btn-profile {
            padding: 14px;
            border-radius: 15px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-edit {
            background: var(--accent-green);
            color: var(--bg-dark);
        }
        
        .btn-edit:hover {
            background: #7AE553;
            transform: translateY(-2px);
        }
        
        .btn-logout {
            background: rgba(255, 59, 48, 0.1);
            color: #FF3B30;
        }
        
        .btn-logout:hover {
            background: #FF3B30;
            color: white;
        }
        
        .profile-content {
            background: var(--bg-medium);
            border-radius: 25px;
            padding: 40px;
        }
        
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .content-title {
            font-size: 28px;
            font-weight: 700;
        }
        
        .tabs {
            display: flex;
            gap: 15px;
            border-bottom: 2px solid var(--bg-dark);
            margin-bottom: 30px;
        }
        
        .tab-btn {
            padding: 15px 25px;
            background: transparent;
            border: none;
            color: var(--text-gray);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }
        
        .tab-btn.active {
            color: var(--accent-green);
        }
        
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-green);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s;
        }
        
        .info-grid {
            display: grid;
            gap: 20px;
        }
        
        .info-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            padding: 20px;
            background: var(--bg-dark);
            border-radius: 15px;
        }
        
        .info-label {
            color: var(--text-gray);
            font-weight: 500;
        }
        
        .info-value {
            font-weight: 600;
        }
        
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .order-card {
            background: var(--bg-dark);
            padding: 25px;
            border-radius: 20px;
            transition: var(--transition);
        }
        
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(137, 255, 98, 0.1);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .order-number {
            font-size: 20px;
            font-weight: 700;
        }
        
        .order-status {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .status-new {
            background: rgba(137, 255, 98, 0.2);
            color: var(--accent-green);
        }
        
        .status-confirmed {
            background: rgba(0, 122, 255, 0.2);
            color: #007AFF;
        }
        
        .status-preparing {
            background: rgba(255, 149, 0, 0.2);
            color: #FF9500;
        }
        
        .status-completed {
            background: rgba(88, 86, 214, 0.2);
            color: #5856D6;
        }
        
        .status-cancelled {
            background: rgba(255, 59, 48, 0.2);
            color: #FF3B30;
        }
        
        .order-details {
            display: flex;
            justify-content: space-between;
            color: var(--text-gray);
            font-size: 14px;
        }
        
        .order-amount {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-green);
            margin-top: 10px;
        }
        
        .empty-orders {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-gray);
        }
        /* Модальное окно */
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-medium);
            border-radius: 25px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 700;
        }
        
        .btn-close {
            width: 40px;
            height: 40px;
            background: var(--bg-dark);
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 20px;
            color: var(--text-gray);
        }
        
        .btn-close:hover {
            background: #FF3B30;
            color: white;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-gray);
        }
        
        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-dark);
            border: 2px solid transparent;
            border-radius: 15px;
            color: var(--text-white);
            font-size: 15px;
            transition: var(--transition);
        }
        
        .form-input:focus {
            border-color: var(--accent-green);
            outline: none;
        }
        
        .form-hint {
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 5px;
        }
        
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--accent-green);
            color: var(--bg-dark);
            border-radius: 15px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-submit:hover {
            background: #7AE553;
            transform: translateY(-2px);
        }
        
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        @media (max-width: 968px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
            .profile-sidebar {
                position: static;
            }
            .info-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .tabs {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    <!-- Хедер -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <svg class="chef-hat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
                    <line x1="6" y1="17" x2="18" y2="17" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
            </a>

            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" class="search-input" placeholder="Поиск в столовой">
            </div>

            <div class="header-right">
                <div class="location-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>ул. Павлова 41</span>
                </div>

                <a href="cart.html" class="header-btn cart-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>Корзина</span>
                    <span class="cart-count" id="cartBadge" style="display: none;">0</span>
                </a>

                <a href="profile.html" class="header-btn profile-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Профиль</span>
                </a>
            </div>
        </div>
    </header>

    <div class="profile-container">
        <a href="index.html" class="back-link">
            ← На главную
        </a>

        <div class="profile-grid">
            <!-- Sidebar -->
            <aside class="profile-sidebar fade-in">
                <div class="profile-avatar" id="profileAvatar">?</div>
                <div class="profile-name" id="profileName">Загрузка...</div>
                <div class="profile-email" id="profileEmail"></div>

                <div class="profile-stats" id="profileStats">
                    <div class="stat-item">
                        <div class="stat-value" id="ordersCount">0</div>
                        <div class="stat-label">Заказов</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalSpent">0 ₽</div>
                        <div class="stat-label">Потрачено</div>
                    </div>
                </div>

                <div class="profile-actions">
                    <button class="btn-profile btn-edit" onclick="openEditModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        Редактировать профиль
                    </button>
                    <button class="btn-profile btn-logout" onclick="logout()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Выйти
                    </button>
                </div>
            </aside>

            <!-- Content -->
            <main class="profile-content fade-in">
                <div class="content-header">
                    <h1 class="content-title">Мой профиль</h1>
                </div>

                <!-- Табы -->
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('info')">Информация</button>
                    <button class="tab-btn" onclick="switchTab('orders')">История заказов</button>
                </div>

                <!-- Вкладка информации -->
                <div class="tab-content active" id="tab-info">
                    <div class="info-grid" id="userInfo">
                        <div class="loader"></div>
                    </div>
                </div>

                <!-- Вкладка заказов -->
                <div class="tab-content" id="tab-orders">
                    <div class="orders-list" id="ordersList">
                        <div class="loader"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Редактировать профиль</h2>
                <button class="btn-close" onclick="closeEditModal()">✕</button>
            </div>
            <form id="editForm">
                <div class="form-group">
                    <label class="form-label">Полное имя</label>
                    <input type="text" class="form-input" id="editFullName" name="full_name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="editEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="tel" class="form-input" id="editPhone" name="phone" placeholder="+7 (999) 123-45-67">
                </div>

                <div class="form-group">
                    <label class="form-label">Новый пароль</label>
                    <input type="password" class="form-input" id="editPassword" name="password" placeholder="••••••••">
                    <div class="form-hint">Оставьте пустым, если не хотите менять пароль</div>
                </div>

                <button type="submit" class="btn-submit" id="editSubmitBtn">
                    Сохранить изменения
                </button>
            </form>
        </div>
    </div>

    <script src="assets/js/cart.js"></script>
    <script>
        let currentUser = null;

        // Проверка авторизации и загрузка данных
        async function checkAuth() {
            try {
                const response = await fetch(getApiUrl('AuthController.php', 'action=check'));
                const result = await response.json();

                console.log('Auth check result:', result);

                if (!result.data || !result.data.authenticated) {
                    alert('Необходимо войти в систему');
                    window.location.href = 'login.html';
                    return null;
                }

                if (!result.data.user) {
                    console.error('User data is missing');
                    window.location.href = 'login.html';
                    return null;
                }

                currentUser = result.data.user;
                console.log('Current user:', currentUser);
                return currentUser;
            } catch (error) {
                console.error('Error:', error);
                alert('Ошибка при проверке авторизации');
                window.location.href = 'login.html';
                return null;
            }
        }

        // Загрузка информации профиля
        function loadProfileInfo() {
            if (!currentUser) {
                console.error('currentUser is null');
                return;
            }

            console.log('Loading profile info for user:', currentUser);

            // Аватар с первой буквой имени
            const firstLetter = currentUser.full_name ? currentUser.full_name[0].toUpperCase() : '?';
            document.getElementById('profileAvatar').textContent = firstLetter;

            // Имя и email
            const displayName = currentUser.full_name || 'Пользователь';
            const displayEmail = currentUser.email || '';

            document.getElementById('profileName').textContent = displayName;
            document.getElementById('profileEmail').textContent = displayEmail;

            console.log('Display name:', displayName);
            console.log('Display email:', displayEmail);

            // Информация в таблице
            const registrationDate = currentUser.created_at ?
                new Date(currentUser.created_at).toLocaleDateString('ru-RU') : 'Не указана';

            const roleText = currentUser.role === 'admin' ? 'Администратор' : 'Пользователь';

            document.getElementById('userInfo').innerHTML = `
        <div class="info-row">
            <div class="info-label">Полное имя</div>
            <div class="info-value">${currentUser.full_name || 'Не указано'}</div>
        </div>
        <div class="info-row">
            <div class="info-label">Email</div>
            <div class="info-value">${currentUser.email || 'Не указан'}</div>
        </div>
        <div class="info-row">
            <div class="info-label">Телефон</div>
            <div class="info-value">${currentUser.phone || 'Не указан'}</div>
        </div>
        <div class="info-row">
            <div class="info-label">Дата регистрации</div>
            <div class="info-value">${registrationDate}</div>
        </div>
        <div class="info-row">
            <div class="info-label">Роль</div>
            <div class="info-value">${roleText}</div>
        </div>
    `;

            // Загружаем статистику
            loadStatistics();
        }

        // Загрузка статистики
        async function loadStatistics() {
            try {
                const response = await fetch(getApiUrl('OrderController.php', 'action=statistics'));
                const result = await response.json();

                console.log('Statistics:', result);

                if (result.success && result.data) {
                    const total = result.data.total || 0;
                    const totalAmount = parseFloat(result.data.total_amount || 0);

                    document.getElementById('ordersCount').textContent = total;
                    document.getElementById('totalSpent').textContent = totalAmount.toFixed(0) + ' ₽';
                } else {
                    document.getElementById('ordersCount').textContent = '0';
                    document.getElementById('totalSpent').textContent = '0 ₽';
                }
            } catch (error) {
                console.error('Error loading statistics:', error);
                document.getElementById('ordersCount').textContent = '0';
                document.getElementById('totalSpent').textContent = '0 ₽';
            }
        }

        // Загрузка заказов
        async function loadOrders() {
            try {
                const response = await fetch(getApiUrl('OrderController.php', 'action=list'));
                const result = await response.json();

                console.log('Orders:', result);

                if (result.success && result.data && result.data.length > 0) {
                    const statusNames = {
                        'new': 'Новый',
                        'confirmed': 'Подтвержден',
                        'preparing': 'Готовится',
                        'ready': 'Готов',
                        'completed': 'Завершен',
                        'cancelled': 'Отменен'
                    };

                    document.getElementById('ordersList').innerHTML = result.data.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <div class="order-number">${order.order_number}</div>
                        <div class="order-status status-${order.status}">${statusNames[order.status]}</div>
                    </div>
                    <div class="order-details">
                        <span>📅 ${new Date(order.created_at).toLocaleDateString('ru-RU')}</span>
                        <span>📦 Товаров: ${order.items_count || 0}</span>
                    </div>
                    <div class="order-amount">${parseFloat(order.total_amount).toFixed(2)} ₽</div>
                </div>
            `).join('');
                } else {
                    document.getElementById('ordersList').innerHTML = `
                <div class="empty-orders">
                    <p>У вас пока нет заказов</p>
                </div>
            `;
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersList').innerHTML = `
            <div class="empty-orders">
                <p style="color: #FF3B30;">Ошибка загрузки заказов</p>
            </div>
        `;
            }
        }

        // Переключение вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');

            if (tabName === 'orders') {
                loadOrders();
            }
        }

        // Открытие модального окна редактирования
        function openEditModal() {
            if (!currentUser) {
                console.error('Cannot open edit modal: currentUser is null');
                return;
            }

            console.log('Opening edit modal with data:', currentUser);

            document.getElementById('editFullName').value = currentUser.full_name || '';
            document.getElementById('editEmail').value = currentUser.email || '';
            document.getElementById('editPhone').value = currentUser.phone || '';
            document.getElementById('editPassword').value = '';

            document.getElementById('editModal').classList.add('show');
        }

        // Закрытие модального окна
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            document.getElementById('editForm').reset();
        }

        // Отправка формы редактирования
        document.getElementById('editForm').addEventListener('submit', async(e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            console.log('Submitting profile update:', data);

            // Удаляем пустой пароль
            if (!data.password) {
                delete data.password;
            }

            const submitBtn = document.getElementById('editSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Сохранение...';

            try {
                const response = await fetch(getApiUrl('UserController.php', 'action=update_profile'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                console.log('Update result:', result);

                if (result.success) {
                    alert('✓ Профиль успешно обновлен');
                    closeEditModal();

                    // ВАЖНО: Перезагружаем данные пользователя из БД
                    const user = await checkAuth();
                    if (user) {
                        loadProfileInfo();
                    }
                } else {
                    alert('Ошибка: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Ошибка соединения с сервером');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Сохранить изменения';
            }
        });

        // Выход
        async function logout() {
            if (!confirm('Вы уверены, что хотите выйти?')) return;

            try {
                await fetch(getApiUrl('AuthController.php', 'action=logout'));
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error:', error);
                window.location.href = 'login.html';
            }
        }

        // Инициализация
        (async() => {
            console.log('Initializing profile page...');
            const user = await checkAuth();
            if (user) {
                console.log('User authenticated, loading profile...');
                loadProfileInfo();
                updateCartBadge();
            }
        })();
    </script>
</body>

</html>
