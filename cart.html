<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - Столовая</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/config.js"></script>
    <style>
        .cart-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            margin-bottom: 30px;
            font-size: 16px;
            transition: var(--transition);
        }
        
        .back-link:hover {
            color: var(--accent-green);
            gap: 12px;
        }
        
        .cart-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .cart-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .cart-items {
            margin-bottom: 30px;
        }
        
        .cart-item {
            background: var(--bg-medium);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            animation: fadeIn 0.4s;
        }
        
        .cart-item-image {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            background: var(--bg-dark);
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .cart-item-info {
            flex: 1;
        }
        
        .cart-item-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .cart-item-weight {
            color: var(--text-gray);
            font-size: 14px;
        }
        
        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-dark);
            padding: 8px 15px;
            border-radius: 15px;
        }
        
        .quantity-btn {
            width: 32px;
            height: 32px;
            background: var(--bg-medium);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--accent-green);
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }
        
        .quantity-btn:hover {
            background: var(--accent-green);
            color: var(--bg-dark);
        }
        
        .quantity-display {
            font-size: 18px;
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }
        
        .cart-item-price {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-green);
            min-width: 120px;
            text-align: right;
        }
        
        .cart-summary {
            background: var(--bg-medium);
            border-radius: 20px;
            padding: 30px;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid var(--bg-dark);
        }
        
        .summary-row:last-child {
            border-bottom: none;
            padding-top: 20px;
        }
        
        .summary-row.total {
            font-size: 28px;
            font-weight: 700;
        }
        
        .summary-row.total .value {
            color: var(--accent-green);
        }
        
        .btn-checkout {
            width: 100%;
            margin-top: 20px;
            padding: 18px;
            background: var(--accent-green);
            color: var(--bg-dark);
            border-radius: 18px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-checkout:hover {
            background: #7AE553;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(137, 255, 98, 0.4);
        }
        
        .btn-checkout:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .empty-cart {
            text-align: center;
            padding: 80px 20px;
        }
        
        .empty-cart svg {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            opacity: 0.3;
            stroke: var(--text-gray);
        }
        
        .empty-cart h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        .empty-cart p {
            color: var(--text-gray);
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .cart-item-controls {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <!-- Хедер -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <svg class="chef-hat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
                    <line x1="6" y1="17" x2="18" y2="17" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
            </a>

            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" class="search-input" placeholder="Поиск в столовой">
            </div>

            <div class="header-right">
                <div class="location-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>ул. Павлова 41</span>
                </div>

                <a href="cart.html" class="header-btn cart-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>Корзина</span>
                    <span class="cart-count" id="cartBadge" style="display: none;">0</span>
                </a>

                <a href="profile.html" class="header-btn profile-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Профиль</span>
                </a>
            </div>
        </div>
    </header>

    <div class="cart-container">
        <a href="index.html" class="back-link">
            ← Вернуться к покупкам
        </a>

        <div class="cart-header">
            <h1>Корзина 🛒</h1>
        </div>

        <div id="cartContent">
            <div class="loader"></div>
        </div>
    </div>

    <script src="assets/js/cart.js"></script>
    <script>
        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cartContent');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart fade-in">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <h2>Корзина пуста</h2>
                        <p>Добавьте товары из каталога</p>
                        <a href="index.html" class="btn btn-primary">Перейти к покупкам</a>
                    </div>
                `;
                return;
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            container.innerHTML = `
                <div class="cart-items">
                    ${cart.map(item => `
                        <div class="cart-item">
                            <div class="cart-item-image">
                                <img src="${getImageUrl(item.image || 'default.jpg')}" alt="${item.name}" onerror="this.src='${getImageUrl('default.jpg')}'">
                            </div>
                            <div class="cart-item-info">
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-weight">${item.weight || '500г'}</div>
                            </div>
                            <div class="cart-item-controls">
                                <div class="quantity-control">
                                    <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                                    <span class="quantity-display">${item.quantity}</span>
                                    <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                                </div>
                                <div class="cart-item-price">${(item.price * item.quantity).toFixed(2)} ₽</div>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="cart-summary fade-in">
                    <div class="summary-row">
                        <span>Сумма заказа:</span>
                        <span class="value">${total.toFixed(2)} ₽</span>
                    </div>
                    <div class="summary-row">
                        <span>Доставка:</span>
                        <span class="value">0 ₽</span>
                    </div>
                    <div class="summary-row total">
                        <span>Итого:</span>
                        <span class="value">${total.toFixed(2)} ₽</span>
                    </div>
                    <button class="btn-checkout" onclick="checkout()" id="checkoutBtn">
                        Оформить заказ
                    </button>
                </div>
            `;
        }

        function updateQuantity(id, newQuantity) {
            if (newQuantity <= 0) {
                if (confirm('Удалить товар из корзины?')) {
                    removeFromCart(id);
                    renderCart();
                    updateCartBadge();
                }
            } else {
                updateCartQuantity(id, newQuantity);
                renderCart();
                updateCartBadge();
            }
        }

        async function checkout() {
            const cart = getCart();
            
            if (cart.length === 0) {
                alert('Корзина пуста');
                return;
            }

            const checkoutBtn = document.getElementById('checkoutBtn');
            checkoutBtn.disabled = true;
            checkoutBtn.textContent = 'Обработка...';

            try {
                // Проверка авторизации
                const authResponse = await fetch(getApiUrl('AuthController.php', 'action=check'));
                const authResult = await authResponse.json();

                console.log('Auth check:', authResult);

                if (!authResult.data || !authResult.data.authenticated) {
                    if (confirm('Для оформления заказа необходимо войти в аккаунт. Перейти на страницу входа?')) {
                        window.location.href = 'login.html';
                    }
                    checkoutBtn.disabled = false;
                    checkoutBtn.textContent = 'Оформить заказ';
                    return;
                }

                // Формирование данных заказа
                const orderData = {
                    items: cart.map(item => ({
                        product_id: item.id,
                        quantity: item.quantity,
                        price: item.price
                    })),
                    total_amount: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                    delivery_type: 'pickup',
                    delivery_address: '',
                    comment: '',
                    payment_method: 'cash'
                };

                console.log('Order data:', orderData);

                // Создание заказа
                const orderResponse = await fetch(getApiUrl('OrderController.php', 'action=create'), {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                console.log('Order response status:', orderResponse.status);
                
                const contentType = orderResponse.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    const text = await orderResponse.text();
                    console.error('Non-JSON response:', text);
                    throw new Error('Сервер вернул некорректный ответ');
                }

                const orderResult = await orderResponse.json();
                console.log('Order result:', orderResult);

                if (orderResult.success) {
                    alert(`✓ Заказ успешно оформлен!\n\nНомер заказа: ${orderResult.data.order_number}\n\nВы можете отслеживать статус заказа в профиле.`);
                    clearCart();
                    updateCartBadge();
                    window.location.href = 'profile.html';
                } else {
                    throw new Error(orderResult.message || 'Ошибка при оформлении заказа');
                }
            } catch (error) {
                console.error('Checkout error:', error);
                alert('Ошибка при оформлении заказа: ' + error.message);
                checkoutBtn.disabled = false;
                checkoutBtn.textContent = 'Оформить заказ';
            }
        }

        // Инициализация
        updateCartBadge();
        renderCart();
    </script>
</body>

</html>
