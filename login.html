<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Столовая</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/config.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        
        .auth-card {
            background: var(--bg-medium);
            padding: 50px;
            border-radius: 30px;
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.5s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .auth-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: var(--text-white);
        }
        
        .auth-header p {
            color: var(--text-gray);
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-gray);
        }
        
        .form-input {
            width: 100%;
            padding: 15px 20px;
            background: var(--bg-dark);
            border: 2px solid transparent;
            border-radius: 18px;
            color: var(--text-white);
            font-size: 16px;
            transition: var(--transition);
        }
        
        .form-input:focus {
            border-color: var(--accent-green);
            outline: none;
        }
        
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--accent-green);
            color: var(--bg-dark);
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }
        
        .btn-submit:hover:not(:disabled) {
            background: #7AE553;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(137, 255, 98, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .auth-link {
            text-align: center;
            margin-top: 25px;
            color: var(--text-gray);
            font-size: 14px;
        }
        
        .auth-link a {
            color: var(--accent-green);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }
        
        .auth-link a:hover {
            text-decoration: underline;
        }
        
        #message {
            margin-top: 20px;
        }
        
        .error-message {
            background: rgba(255, 59, 48, 0.1);
            border-left: 3px solid #FF3B30;
            padding: 12px 15px;
            border-radius: 10px;
            color: #FF3B30;
            font-size: 14px;
            animation: shake 0.3s;
        }
        
        .success-message {
            background: rgba(137, 255, 98, 0.1);
            border-left: 3px solid var(--accent-green);
            padding: 12px 15px;
            border-radius: 10px;
            color: var(--accent-green);
            font-size: 14px;
        }
        
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }
        
        @media (max-width: 580px) {
            .auth-card {
                padding: 35px 25px;
            }
            .auth-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <!-- Хедер -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <svg class="chef-hat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
                    <line x1="6" y1="17" x2="18" y2="17" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
            </a>

            <div style="font-size: 20px; font-weight: 600; color: var(--text-white); margin-left: 12px;">
                Столовая
            </div>

            <div class="header-right">
                <a href="index.html" class="header-btn profile-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>На главную</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Форма входа -->
    <div class="auth-wrapper">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <h1>Добро пожаловать! 👋</h1>
                <p>Войдите в свой аккаунт</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-input" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    Войти
                </button>

                <div id="message"></div>
            </form>

            <div class="auth-link">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </div>

            <div class="auth-link" style="margin-top: 10px;">
                <small style="color: var(--text-gray);">
                    Тест: admin@canteen.ru / admin123
                </small>
            </div>
        </div>
    </div>

    <script>
        // Отправка формы
        document.getElementById('loginForm').addEventListener('submit', async(e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Вход...';
            messageDiv.innerHTML = '';

            try {
                const response = await fetch(getApiUrl('AuthController.php', 'action=login'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                console.log('Login result:', result);

                if (result.success) {
                    messageDiv.innerHTML = '<div class="success-message">✓ Вход выполнен успешно!</div>';

                    // Перенаправление
                    setTimeout(() => {
                        if (result.redirect) {
                            window.location.href = result.redirect;
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 500);
                } else {
                    messageDiv.innerHTML = '<div class="error-message">✗ ' + result.message + '</div>';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Войти';
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.innerHTML = '<div class="error-message">✗ Ошибка соединения с сервером</div>';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        });

        // Проверка, если уже авторизован
        (async() => {
            try {
                const response = await fetch(getApiUrl('AuthController.php', 'action=check'));
                const result = await response.json();

                if (result.data && result.data.authenticated) {
                    // Уже авторизован, перенаправляем
                    if (result.data.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }
            } catch (error) {
                console.log('User not authenticated');
            }
        })();
    </script>
</body>

</html>
