<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар - Столовая</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .product-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            margin-bottom: 30px;
            font-size: 16px;
            transition: var(--transition);
        }
        
        .back-link:hover {
            color: var(--accent-green);
            gap: 12px;
        }
        
        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 50px;
            animation: fadeIn 0.5s;
        }
        
        .product-image-large {
            background: var(--bg-medium);
            border-radius: 30px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1;
        }
        
        .product-image-large img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 20px;
        }
        
        .discount-badge {
            position: absolute;
            top: 30px;
            left: 30px;
            background: #FF3B30;
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 16px;
        }
        
        .product-details {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .product-title {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.2;
        }
        
        .product-rating-large {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .stars {
            display: flex;
            gap: 5px;
        }
        
        .star {
            width: 24px;
            height: 24px;
            fill: var(--accent-green);
        }
        
        .star.empty {
            fill: var(--bg-dark);
        }
        
        .rating-text {
            color: var(--text-gray);
            font-size: 16px;
        }
        
        .product-price-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .product-price-large {
            font-size: 48px;
            font-weight: 700;
            color: var(--accent-green);
        }
        
        .product-old-price {
            font-size: 32px;
            color: var(--text-gray);
            text-decoration: line-through;
        }
        
        .product-description {
            color: var(--text-gray);
            line-height: 1.6;
            font-size: 16px;
        }
        
        .product-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            background: var(--bg-medium);
            padding: 20px;
            border-radius: 20px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
        }
        
        .info-label {
            color: var(--text-gray);
            font-size: 14px;
        }
        
        .info-value {
            font-weight: 600;
            font-size: 14px;
        }
        
        .product-actions {
            display: flex;
            gap: 15px;
        }
        
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-medium);
            padding: 15px 25px;
            border-radius: 20px;
        }
        
        .qty-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-dark);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--accent-green);
            cursor: pointer;
            border: none;
            transition: var(--transition);
        }
        
        .qty-btn:hover {
            background: var(--accent-green);
            color: var(--bg-dark);
        }
        
        .qty-display {
            font-size: 24px;
            font-weight: 700;
            min-width: 40px;
            text-align: center;
        }
        
        .btn-add-large {
            flex: 1;
            padding: 20px;
            background: var(--accent-green);
            color: var(--bg-dark);
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-add-large:hover {
            background: #7AE553;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(137, 255, 98, 0.4);
        }
        
        .product-tabs {
            display: flex;
            gap: 15px;
            border-bottom: 2px solid var(--bg-medium);
            margin-bottom: 30px;
        }
        
        .tab-btn {
            padding: 15px 25px;
            background: transparent;
            border: none;
            color: var(--text-gray);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }
        
        .tab-btn.active {
            color: var(--accent-green);
        }
        
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-green);
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.4s;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .composition {
            background: var(--bg-medium);
            padding: 30px;
            border-radius: 20px;
            line-height: 1.8;
            color: var(--text-gray);
        }
        
        .reviews-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .review-card {
            background: var(--bg-medium);
            padding: 25px;
            border-radius: 20px;
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .review-author {
            font-weight: 600;
            font-size: 16px;
        }
        
        .review-stars {
            display: flex;
            gap: 3px;
        }
        
        .review-stars svg {
            width: 16px;
            height: 16px;
            fill: var(--accent-green);
        }
        
        .review-text {
            color: var(--text-gray);
            line-height: 1.6;
        }
        
        .review-date {
            color: var(--text-gray);
            font-size: 13px;
            margin-top: 10px;
        }
        
        .empty-reviews {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-gray);
        }
        
        @media (max-width: 968px) {
            .product-detail {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .product-title {
                font-size: 28px;
            }
            .product-price-large {
                font-size: 36px;
            }
            .product-info-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 580px) {
            .product-actions {
                flex-direction: column;
            }
            .quantity-selector {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
    <script src="assets/js/config.js"></script>
</head>

<body>
    <!-- Хедер -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <svg class="chef-hat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
                    <line x1="6" y1="17" x2="18" y2="17" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
            </a>

            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" class="search-input" placeholder="Поиск в столовой">
            </div>

            <div class="header-right">
                <div class="location-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>ул. Павлова 41</span>
                </div>

                <a href="cart.html" class="header-btn cart-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>Корзина</span>
                    <span class="cart-count" id="cartBadge" style="display: none;">0</span>
                </a>

                <a href="profile.html" class="header-btn profile-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Профиль</span>
                </a>
            </div>
        </div>
    </header>

    <div class="product-container">
        <a href="index.html" class="back-link">
            ← Назад к каталогу
        </a>

        <div id="productContent">
            <div class="loader" style="margin: 100px auto;"></div>
        </div>
    </div>

    <script src="assets/js/cart.js"></script>
    <script>
        let currentQuantity = 1;
        let currentProduct = null;

        // Получение ID товара из URL
        function getProductId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // Загрузка товара
        async function loadProduct() {
            const productId = getProductId();

            if (!productId) {
                document.getElementById('productContent').innerHTML = '<p style="text-align: center; color: var(--text-gray);">Товар не найден</p>';
                return;
            }

            try {
                const response = await fetch(getApiUrl('ProductController.php', `action=get&id=${productId}`));

                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error('Invalid response format');
                }

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message);
                }

                currentProduct = result.data;
                renderProduct(currentProduct);
                loadReviews(productId);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('productContent').innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <h2 style="margin-bottom: 20px;">Ошибка загрузки товара</h2>
                        <p style="color: var(--text-gray); margin-bottom: 30px;">${error.message}</p>
                        <a href="index.html" class="btn btn-primary">Вернуться в каталог</a>
                    </div>
                `;
            }
        }

        // Рендер товара
        function renderProduct(product) {
            const rating = product.avg_rating ? parseFloat(product.avg_rating) : 0;
            const fullStars = Math.floor(rating);
            const imagePath = product.image_path ? `assets/images/products/${product.image_path}` : 'assets/images/products/default.jpg';
            const weight = `${product.weight}${product.unit === 'g' ? 'г' : product.unit === 'ml' ? 'мл' : 'шт'}`;
            const discount = product.old_price ? Math.round((1 - product.price / product.old_price) * 100) : 0;

            document.getElementById('productContent').innerHTML = `
                <div class="product-detail">
                    <div class="product-image-large">
                        ${discount > 0 ? `<div class="discount-badge">-${discount}%</div>` : ''}
                        <img src="${imagePath}" alt="${product.name}" onerror="this.src='assets/images/products/default.jpg'">
                    </div>

                    <div class="product-details">
                        <h1 class="product-title">${product.name}</h1>

                        <div class="product-rating-large">
                            <div class="stars">
                                ${Array.from({length: 5}, (_, i) => `
                                    <svg class="star ${i >= fullStars ? 'empty' : ''}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                                    </svg>
                                `).join('')}
                            </div>
                            <span class="rating-text">${rating.toFixed(1)} (${product.review_count || 0} отзывов)</span>
                        </div>

                        <div class="product-price-section">
                            <div class="product-price-large">${product.price} ₽</div>
                            ${product.old_price ? `<div class="product-old-price">${product.old_price} ₽</div>` : ''}
                        </div>

                        <div class="product-description">
                            ${product.description || 'Описание отсутствует'}
                        </div>

                        <div class="product-info-grid">
                            <div class="info-item">
                                <span class="info-label">Вес/Объем</span>
                                <span class="info-value">${weight}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Калории</span>
                                <span class="info-value">${product.calories || 0} ккал</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Белки</span>
                                <span class="info-value">${product.proteins || 0} г</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Жиры</span>
                                <span class="info-value">${product.fats || 0} г</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Углеводы</span>
                                <span class="info-value">${product.carbs || 0} г</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">В наличии</span>
                                <span class="info-value">${product.stock_quantity || 0} шт</span>
                            </div>
                        </div>

                        <div class="product-actions">
                            <div class="quantity-selector">
                                <button class="qty-btn" onclick="changeQuantity(-1)">−</button>
                                <span class="qty-display" id="qtyDisplay">1</span>
                                <button class="qty-btn" onclick="changeQuantity(1)">+</button>
                            </div>
                            <button class="btn-add-large" onclick="addProductToCart()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="9" cy="21" r="1"></circle>
                                    <circle cx="20" cy="21" r="1"></circle>
                                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                                </svg>
                                Добавить в корзину
                            </button>
                        </div>
                    </div>
                </div>

                <div class="product-tabs">
                    <button class="tab-btn active" data-tab="composition">Состав</button>
                    <button class="tab-btn" data-tab="reviews">Отзывы</button>
                </div>

                <div class="tab-content active" id="compositionTab">
                    <div class="composition">
                        ${product.composition || 'Информация о составе отсутствует'}
                    </div>
                </div>

                <div class="tab-content" id="reviewsTab">
                    <div class="reviews-section" id="reviewsList">
                        <div class="loader"></div>
                    </div>
                </div>
            `;

            // Инициализация табов
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
                });
            });
        }

        // Изменение количества
        function changeQuantity(delta) {
            currentQuantity = Math.max(1, currentQuantity + delta);
            document.getElementById('qtyDisplay').textContent = currentQuantity;
        }

        // Добавление в корзину
        function addProductToCart() {
            if (!currentProduct) return;

            const weight = `${currentProduct.weight}${currentProduct.unit === 'g' ? 'г' : currentProduct.unit === 'ml' ? 'мл' : 'шт'}`;
            
            addToCart(
                currentProduct.id,
                currentProduct.name,
                currentProduct.price,
                currentQuantity,
                weight,
                currentProduct.image_path
            );

            // Анимация кнопки
            const btn = document.querySelector('.btn-add-large');
            const originalText = btn.innerHTML;
            btn.innerHTML = '✓ Добавлено';
            btn.style.background = '#34C759';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
            }, 2000);
        }

        // Загрузка отзывов
        async function loadReviews(productId) {
            try {
                const response = await fetch(getApiUrl('ProductController.php', `action=reviews&id=${productId}`));
                const result = await response.json();

                const container = document.getElementById('reviewsList');

                if (!result.success || result.data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-reviews">
                            <p>Отзывов пока нет. Станьте первым!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = result.data.map(review => {
                    const date = new Date(review.created_at).toLocaleDateString('ru-RU', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    });

                    return `
                        <div class="review-card fade-in">
                            <div class="review-header">
                                <div class="review-author">${review.user_name}</div>
                                <div class="review-stars">
                                    ${Array.from({length: review.rating}, () => `
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                                        </svg>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="review-text">${review.comment}</div>
                            <div class="review-date">${date}</div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading reviews:', error);
                document.getElementById('reviewsList').innerHTML = `
                    <div class="empty-reviews">
                        <p>Ошибка загрузки отзывов</p>
                    </div>
                `;
            }
        }

        // Инициализация
        updateCartBadge();
        loadProduct();
    </script>
</body>

</html>
