<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Столовая</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/config.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        
        .auth-card {
            background: var(--bg-medium);
            padding: 50px;
            border-radius: 30px;
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.5s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .auth-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: var(--text-white);
        }
        
        .auth-header p {
            color: var(--text-gray);
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-gray);
        }
        
        .form-input {
            width: 100%;
            padding: 15px 20px;
            background: var(--bg-dark);
            border: 2px solid transparent;
            border-radius: 18px;
            color: var(--text-white);
            font-size: 16px;
            transition: var(--transition);
        }
        
        .form-input:focus {
            border-color: var(--accent-green);
            outline: none;
        }
        
        .form-input.error {
            border-color: #FF3B30;
        }
        
        .form-input.success {
            border-color: var(--accent-green);
        }
        
        .field-error {
            color: #FF3B30;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        
        .field-error.show {
            display: block;
            animation: shake 0.3s;
        }
        
        .field-success {
            color: var(--accent-green);
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        
        .field-success.show {
            display: block;
        }
        
        .password-strength {
            margin-top: 10px;
        }
        
        .strength-bar {
            height: 4px;
            background: var(--bg-dark);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        
        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
            border-radius: 2px;
        }
        
        .strength-weak {
            background: #FF3B30;
            width: 33%;
        }
        
        .strength-medium {
            background: #FF9500;
            width: 66%;
        }
        
        .strength-strong {
            background: var(--accent-green);
            width: 100%;
        }
        
        .strength-text {
            font-size: 12px;
            color: var(--text-gray);
        }
        
        .captcha-group {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        
        .captcha-input {
            flex: 1;
        }
        
        .captcha-image {
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--bg-dark);
            transition: var(--transition);
            flex-shrink: 0;
        }
        
        .captcha-image:hover {
            border-color: var(--accent-green);
            transform: scale(1.02);
        }
        
        .captcha-hint {
            color: var(--text-gray);
            font-size: 13px;
            margin-top: 8px;
            display: block;
        }
        
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--accent-green);
            color: var(--bg-dark);
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }
        
        .btn-submit:hover:not(:disabled) {
            background: #7AE553;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(137, 255, 98, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .auth-link {
            text-align: center;
            margin-top: 25px;
            color: var(--text-gray);
            font-size: 14px;
        }
        
        .auth-link a {
            color: var(--accent-green);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }
        
        .auth-link a:hover {
            text-decoration: underline;
        }
        
        #message {
            margin-top: 20px;
        }
        
        .error-message {
            background: rgba(255, 59, 48, 0.1);
            border-left: 3px solid #FF3B30;
            padding: 12px 15px;
            border-radius: 10px;
            color: #FF3B30;
            font-size: 14px;
            animation: shake 0.3s;
        }
        
        .success-message {
            background: rgba(137, 255, 98, 0.1);
            border-left: 3px solid var(--accent-green);
            padding: 12px 15px;
            border-radius: 10px;
            color: var(--accent-green);
            font-size: 14px;
        }
        
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }
        
        @media (max-width: 580px) {
            .auth-card {
                padding: 35px 25px;
            }
            .auth-header h1 {
                font-size: 26px;
            }
            .captcha-group {
                flex-direction: column;
                align-items: stretch;
            }
            .captcha-image {
                width: 100%;
            }
            .captcha-image img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>
    <!-- Хедер -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <svg class="chef-hat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
                    <line x1="6" y1="17" x2="18" y2="17" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
            </a>

            <div style="font-size: 20px; font-weight: 600; color: var(--text-white); margin-left: 12px;">
                Столовая
            </div>

            <div class="header-right">
                <a href="index.html" class="header-btn profile-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>На главную</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Форма регистрации -->
    <div class="auth-wrapper">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <h1>Создать аккаунт 🎉</h1>
                <p>Заполните форму для регистрации</p>
            </div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label class="form-label">Полное имя *</label>
                    <input type="text" class="form-input" id="fullName" name="full_name" placeholder="Иван Иванов" required>
                    <div class="field-error" id="fullNameError"></div>
                    <div class="field-success" id="fullNameSuccess">✓ Имя введено корректно</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="your@email.com" required>
                    <div class="field-error" id="emailError"></div>
                    <div class="field-success" id="emailSuccess">✓ Email введен корректно</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Пароль (минимум 6 символов) *</label>
                    <input type="password" class="form-input" id="password" name="password" placeholder="••••••••" required>
                    <div class="field-error" id="passwordError"></div>
                    <div class="password-strength" id="passwordStrength" style="display: none;">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-text" id="strengthText"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Введите код с картинки *</label>
                    <div class="captcha-group">
                        <div class="captcha-input">
                            <input type="text" class="form-input" id="captcha" name="captcha" placeholder="ABCD" required maxlength="4" style="text-transform: uppercase;">
                            <div class="field-error" id="captchaError"></div>
                        </div>
                        <div class="captcha-image" onclick="refreshCaptcha()" title="Нажмите для обновления">
                            <img id="captchaImage" src="api/utils/captcha.php" alt="Captcha" width="140" height="50">
                        </div>
                    </div>
                    <small class="captcha-hint">Нажмите на картинку для обновления кода</small>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    Зарегистрироваться
                </button>

                <div id="message"></div>
            </form>

            <div class="auth-link">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </div>
        </div>
    </div>

    <script>
        // Валидация полей
        const validators = {
            fullName: {
                validate: (value) => {
                    if (value.trim().length < 3) {
                        return 'Имя должно содержать минимум 3 символа';
                    }
                    if (!/^[а-яА-ЯёЁa-zA-Z\s-]+$/.test(value)) {
                        return 'Имя может содержать только буквы, пробелы и дефисы';
                    }
                    return null;
                }
            },
            email: {
                validate: (value) => {
                    if (!value.trim()) {
                        return 'Email обязателен для заполнения';
                    }
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(value)) {
                        return 'Введите корректный email адрес';
                    }
                    return null;
                }
            },
            password: {
                validate: (value) => {
                    if (value.length < 6) {
                        return 'Пароль должен содержать минимум 6 символов';
                    }
                    return null;
                }
            },
            captcha: {
                validate: (value) => {
                    if (value.trim().length !== 4) {
                        return 'Введите 4 символа с картинки';
                    }
                    return null;
                }
            }
        };

        // Проверка силы пароля
        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('passwordStrength');
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');

            if (password.length === 0) {
                strengthBar.style.display = 'none';
                return;
            }

            strengthBar.style.display = 'block';

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            fill.className = 'strength-fill';
            if (strength <= 2) {
                fill.classList.add('strength-weak');
                text.textContent = 'Слабый пароль';
                text.style.color = '#FF3B30';
            } else if (strength <= 4) {
                fill.classList.add('strength-medium');
                text.textContent = 'Средний пароль';
                text.style.color = '#FF9500';
            } else {
                fill.classList.add('strength-strong');
                text.textContent = 'Надежный пароль';
                text.style.color = 'var(--accent-green)';
            }
        }

        // Валидация поля в реальном времени
        function validateField(fieldId, validatorKey) {
            const field = document.getElementById(fieldId);
            const error = document.getElementById(fieldId + 'Error');
            const success = document.getElementById(fieldId + 'Success');
            const value = field.value;

            const errorMessage = validators[validatorKey].validate(value);

            if (errorMessage) {
                field.classList.remove('success');
                field.classList.add('error');
                error.textContent = errorMessage;
                error.classList.add('show');
                if (success) success.classList.remove('show');
                return false;
            } else {
                field.classList.remove('error');
                field.classList.add('success');
                error.classList.remove('show');
                if (success) success.classList.add('show');
                return true;
            }
        }

        // Обработчики для всех полей
        document.getElementById('fullName').addEventListener('blur', () => validateField('fullName', 'fullName'));
        document.getElementById('fullName').addEventListener('input', () => {
            if (document.getElementById('fullName').value.length >= 3) {
                validateField('fullName', 'fullName');
            }
        });

        document.getElementById('email').addEventListener('blur', () => validateField('email', 'email'));
        document.getElementById('email').addEventListener('input', () => {
            const email = document.getElementById('email').value;
            if (email.includes('@')) {
                validateField('email', 'email');
            }
        });

        document.getElementById('password').addEventListener('input', (e) => {
            checkPasswordStrength(e.target.value);
            if (e.target.value.length >= 6) {
                validateField('password', 'password');
            }
        });
        document.getElementById('password').addEventListener('blur', () => validateField('password', 'password'));

        document.getElementById('captcha').addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
            if (e.target.value.length === 4) {
                validateField('captcha', 'captcha');
            }
        });

        // Обновление капчи
        function refreshCaptcha() {
            document.getElementById('captchaImage').src = BASE_PATH + 'api/utils/captcha.php?' + Date.now();
            document.getElementById('captcha').value = '';
            document.getElementById('captcha').classList.remove('error', 'success');
            document.getElementById('captchaError').classList.remove('show');
        }

        // Отправка формы
        document.getElementById('registerForm').addEventListener('submit', async(e) => {
            e.preventDefault();

            // Валидация всех полей
            const fullNameValid = validateField('fullName', 'fullName');
            const emailValid = validateField('email', 'email');
            const passwordValid = validateField('password', 'password');
            const captchaValid = validateField('captcha', 'captcha');

            if (!fullNameValid || !emailValid || !passwordValid || !captchaValid) {
                return;
            }

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Регистрация...';

            try {
                const response = await fetch(getApiUrl('AuthController.php', 'action=register'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    messageDiv.innerHTML = '<div class="success-message">✓ ' + result.message + '</div>';
                    e.target.reset();
                    document.querySelectorAll('.form-input').forEach(input => {
                        input.classList.remove('success', 'error');
                    });
                    document.querySelectorAll('.field-success').forEach(el => el.classList.remove('show'));
                    document.getElementById('passwordStrength').style.display = 'none';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    messageDiv.innerHTML = '<div class="error-message">✗ ' + result.message + '</div>';
                    refreshCaptcha();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Зарегистрироваться';
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.innerHTML = '<div class="error-message">✗ Ошибка соединения с сервером</div>';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Зарегистрироваться';
            }
        });
    </script>
</body>

</html>
