<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Столовая</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/config.js"></script>
    <style>
        body {
            background: var(--bg-dark);
        }
        
        .admin-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
        }
        
        .admin-sidebar {
            background: var(--bg-medium);
            border-radius: 25px;
            padding: 30px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        
        .admin-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .admin-logo h2 {
            font-size: 24px;
            color: var(--accent-green);
        }
        
        .admin-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .menu-item {
            padding: 15px 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-gray);
            font-weight: 500;
        }
        
        .menu-item:hover {
            background: var(--bg-dark);
            color: var(--text-white);
        }
        
        .menu-item.active {
            background: var(--accent-green);
            color: var(--bg-dark);
        }
        
        .menu-item svg {
            width: 22px;
            height: 22px;
        }
        
        .admin-content {
            background: var(--bg-medium);
            border-radius: 25px;
            padding: 40px;
        }
        
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .content-title {
            font-size: 32px;
            font-weight: 700;
        }
        
        .btn-logout-admin {
            padding: 12px 24px;
            background: rgba(255, 59, 48, 0.1);
            color: #FF3B30;
            border-radius: 15px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-logout-admin:hover {
            background: #FF3B30;
            color: white;
        }
        
        .btn-add {
            padding: 12px 24px;
            background: var(--accent-green);
            color: var(--bg-dark);
            border-radius: 15px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-add:hover {
            background: #7AE553;
            transform: translateY(-2px);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--bg-dark);
            padding: 25px;
            border-radius: 20px;
            transition: var(--transition);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(137, 255, 98, 0.15);
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            background: rgba(137, 255, 98, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .stat-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--accent-green);
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: var(--text-gray);
            font-size: 14px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-dark);
            border-radius: 20px;
            overflow: hidden;
        }
        
        .data-table thead {
            background: rgba(137, 255, 98, 0.1);
        }
        
        .data-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--accent-green);
            font-size: 14px;
        }
        
        .data-table td {
            padding: 15px;
            border-top: 1px solid var(--bg-medium);
        }
        
        .data-table tr:hover {
            background: rgba(137, 255, 98, 0.05);
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-new {
            background: rgba(137, 255, 98, 0.2);
            color: var(--accent-green);
        }
        
        .status-confirmed {
            background: rgba(0, 122, 255, 0.2);
            color: #007AFF;
        }
        
        .status-completed {
            background: rgba(88, 86, 214, 0.2);
            color: #5856D6;
        }
        
        .status-active {
            background: rgba(52, 199, 89, 0.2);
            color: #34C759;
        }
        
        .status-inactive {
            background: rgba(255, 59, 48, 0.2);
            color: #FF3B30;
        }
        
        .role-badge {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .role-admin {
            background: rgba(255, 149, 0, 0.2);
            color: #FF9500;
        }
        
        .role-user {
            background: rgba(137, 255, 98, 0.2);
            color: var(--accent-green);
        }
        
        .action-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: var(--transition);
            margin-right: 5px;
        }
        
        .btn-edit {
            background: rgba(0, 122, 255, 0.1);
            color: #007AFF;
        }
        
        .btn-edit:hover {
            background: #007AFF;
            color: white;
        }
        
        .btn-delete {
            background: rgba(255, 59, 48, 0.1);
            color: #FF3B30;
        }
        
        .btn-delete:hover {
            background: #FF3B30;
            color: white;
        }
        
        .btn-toggle {
            background: rgba(137, 255, 98, 0.1);
            color: var(--accent-green);
        }
        
        .btn-toggle:hover {
            background: var(--accent-green);
            color: var(--bg-dark);
        }
        
        .section {
            display: none;
        }
        
        .section.active {
            display: block;
            animation: fadeIn 0.4s;
        }
        /* Модальное окно */
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-medium);
            border-radius: 25px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 700;
        }
        
        .btn-close {
            width: 40px;
            height: 40px;
            background: var(--bg-dark);
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        
        .btn-close:hover {
            background: #FF3B30;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-gray);
        }
        
        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 18px;
            background: var(--bg-dark);
            border: 2px solid transparent;
            border-radius: 12px;
            color: var(--text-white);
            font-size: 15px;
            transition: var(--transition);
        }
        
        .form-input:focus,
        .form-select:focus {
            border-color: var(--accent-green);
            outline: none;
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-green);
            color: var(--bg-dark);
            border-radius: 15px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-submit:hover {
            background: #7AE553;
            transform: translateY(-2px);
        }
        
        @media (max-width: 968px) {
            .admin-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .admin-sidebar {
                position: static;
            }
            .admin-menu {
                flex-direction: row;
                overflow-x: auto;
            }
            .menu-item span {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <h2>🍽️ Админ-панель</h2>
            </div>
            <nav class="admin-menu">
                <div class="menu-item active" onclick="showSection('dashboard')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Главная</span>
                </div>
                <div class="menu-item" onclick="showSection('orders')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>Заказы</span>
                </div>
                <div class="menu-item" onclick="showSection('users')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                    <span>Пользователи</span>
                </div>
                <div class="menu-item" onclick="showSection('products')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 7h-9"></path>
                        <path d="M14 17H5"></path>
                        <circle cx="17" cy="17" r="3"></circle>
                        <circle cx="7" cy="7" r="3"></circle>
                    </svg>
                    <span>Товары</span>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="content-header">
                <h1 class="content-title" id="sectionTitle">Главная</h1>
                <button class="btn-logout-admin" onclick="logout()">Выйти</button>
            </div>

            <!-- Dashboard Section -->
            <div class="section active" id="dashboard">
                <div class="stats-grid" id="statsGrid">
                    <div class="loader"></div>
                </div>
            </div>

            <!-- Orders Section -->
            <div class="section" id="orders">
                <div id="ordersContent">
                    <div class="loader"></div>
                </div>
            </div>

            <!-- Users Section -->
            <div class="section" id="users">
                <div style="margin-bottom: 20px;">
                    <button class="btn-add" onclick="openUserModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Добавить пользователя
                    </button>
                </div>
                <div id="usersContent">
                    <div class="loader"></div>
                </div>
            </div>

            <!-- Products Section -->
            <div class="section" id="products">
                <div id="productsContent">
                    <p style="color: var(--text-gray);">Управление товарами в разработке...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Модальное окно пользователя -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Добавить пользователя</h2>
                <button class="btn-close" onclick="closeUserModal()">✕</button>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId" name="id">

                <div class="form-group">
                    <label class="form-label">Полное имя *</label>
                    <input type="text" class="form-input" id="userFullName" name="full_name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-input" id="userEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="tel" class="form-input" id="userPhone" name="phone" placeholder="+7 (999) 123-45-67">
                </div>

                <div class="form-group">
                    <label class="form-label">Пароль <span id="passwordHint">(минимум 6 символов)</span></label>
                    <input type="password" class="form-input" id="userPassword" name="password">
                </div>

                <div class="form-group">
                    <label class="form-label">Роль *</label>
                    <select class="form-select" id="userRole" name="role" required>
                        <option value="user">Пользователь</option>
                        <option value="admin">Администратор</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Статус *</label>
                    <select class="form-select" id="userActive" name="is_active" required>
                        <option value="1">Активен</option>
                        <option value="0">Заблокирован</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit" id="userSubmitBtn">Сохранить</button>
            </form>
        </div>
    </div>

    <script>
        let currentEditUserId = null;

        // Проверка прав админа
        async function checkAdmin() {
            try {
                const response = await fetch(getApiUrl('AuthController.php', 'action=check'));
                const result = await response.json();

                if (!result.data.authenticated || result.data.user.role !== 'admin') {
                    alert('Доступ запрещен. Требуются права администратора.');
                    window.location.href = 'login.html';
                    return false;
                }

                return true;
            } catch (error) {
                console.error('Error:', error);
                window.location.href = 'login.html';
                return false;
            }
        }

        // Загрузка статистики
        async function loadStatistics() {
            try {
                const response = await fetch(getApiUrl('OrderController.php', 'action=statistics'));
                const result = await response.json();

                if (result.success) {
                    const stats = result.data;
                    document.getElementById('statsGrid').innerHTML = `
                        <div class="stat-card fade-in">
                            <div class="stat-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="9" cy="21" r="1"></circle>
                                    <circle cx="20" cy="21" r="1"></circle>
                                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                                </svg>
                            </div>
                            <div class="stat-value">${stats.total || 0}</div>
                            <div class="stat-label">Всего заказов</div>
                        </div>
                        <div class="stat-card fade-in">
                            <div class="stat-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                            <div class="stat-value">${stats.completed || 0}</div>
                            <div class="stat-label">Завершенных</div>
                        </div>
                        <div class="stat-card fade-in">
                            <div class="stat-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="1" x2="12" y2="23"></line>
                                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                                </svg>
                            </div>
                            <div class="stat-value">${parseFloat(stats.total_amount || 0).toFixed(0)} ₽</div>
                            <div class="stat-label">Общая сумма</div>
                        </div>
                        <div class="stat-card fade-in">
                            <div class="stat-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="8.5" cy="7" r="4"></circle>
                                    <line x1="20" y1="8" x2="20" y2="14"></line>
                                    <line x1="23" y1="11" x2="17" y2="11"></line>
                                </svg>
                            </div>
                            <div class="stat-value">${parseFloat(stats.avg_amount || 0).toFixed(0)} ₽</div>
                            <div class="stat-label">Средний чек</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        // Загрузка заказов
        async function loadOrders() {
            try {
                const response = await fetch(getApiUrl('OrderController.php', 'action=list'));
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    const statusNames = {
                        'new': 'Новый',
                        'confirmed': 'Подтвержден',
                        'preparing': 'Готовится',
                        'ready': 'Готов',
                        'completed': 'Завершен',
                        'cancelled': 'Отменен'
                    };

                    document.getElementById('ordersContent').innerHTML = `
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>№ заказа</th>
                                    <th>Клиент</th>
                                    <th>Дата</th>
                                    <th>Сумма</th>
                                    <th>Статус</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${result.data.map(order => `
                                    <tr>
                                        <td><strong>${order.order_number}</strong></td>
                                        <td>${order.full_name || order.email}</td>
                                        <td>${new Date(order.created_at).toLocaleDateString('ru-RU')}</td>
                                        <td><strong style="color: var(--accent-green);">${parseFloat(order.total_amount).toFixed(2)} ₽</strong></td>
                                        <td><span class="status-badge status-${order.status}">${statusNames[order.status]}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    document.getElementById('ordersContent').innerHTML = '<p style="color: var(--text-gray); text-align: center; padding: 40px;">Заказов пока нет</p>';
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersContent').innerHTML = '<p style="color: #FF3B30; text-align: center;">Ошибка загрузки заказов</p>';
            }
        }

        // Загрузка пользователей
        async function loadUsers() {
            try {
                const response = await fetch(getApiUrl('UserController.php', 'action=list'));
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    document.getElementById('usersContent').innerHTML = `
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Имя</th>
                                    <th>Email</th>
                                    <th>Роль</th>
                                    <th>Статус</th>
                                    <th>Регистрация</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${result.data.map(user => `
                                    <tr>
                                        <td><strong>#${user.id}</strong></td>
                                        <td>${user.full_name}</td>
                                        <td>${user.email}</td>
                                        <td><span class="role-badge role-${user.role}">${user.role === 'admin' ? 'Админ' : 'Пользователь'}</span></td>
                                        <td><span class="status-badge status-${user.is_active ? 'active' : 'inactive'}">${user.is_active ? 'Активен' : 'Заблокирован'}</span></td>
                                        <td>${new Date(user.created_at).toLocaleDateString('ru-RU')}</td>
                                        <td>
                                            <button class="action-btn btn-edit" onclick="editUser(${user.id})">Изменить</button>
                                            <button class="action-btn btn-delete" onclick="deleteUser(${user.id}, '${user.full_name}')">Удалить</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    document.getElementById('usersContent').innerHTML = '<p style="color: var(--text-gray); text-align: center; padding: 40px;">Пользователей нет</p>';
                }
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersContent').innerHTML = '<p style="color: #FF3B30; text-align: center;">Ошибка загрузки пользователей</p>';
            }
        }

        // Открытие модального окна создания пользователя
        function openUserModal() {
            currentEditUserId = null;
            document.getElementById('modalTitle').textContent = 'Добавить пользователя';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('userPassword').required = true;
            document.getElementById('passwordHint').textContent = '(минимум 6 символов) *';
            document.getElementById('userModal').classList.add('show');
        }

        // Редактирование пользователя
        async function editUser(userId) {
            try {
                const response = await fetch(getApiUrl('UserController.php', `action=get&id=${userId}`));
                const result = await response.json();

                if (result.success) {
                    const user = result.data;
                    currentEditUserId = userId;
                    
                    document.getElementById('modalTitle').textContent = 'Редактировать пользователя';
                    document.getElementById('userId').value = user.id;
                    document.getElementById('userFullName').value = user.full_name;
                    document.getElementById('userEmail').value = user.email;
                    document.getElementById('userPhone').value = user.phone || '';
                    document.getElementById('userRole').value = user.role;
                    document.getElementById('userActive').value = user.is_active;
                    document.getElementById('userPassword').value = '';
                    document.getElementById('userPassword').required = false;
                    document.getElementById('passwordHint').textContent = '(оставьте пустым, если не хотите менять)';
                    
                    document.getElementById('userModal').classList.add('show');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Ошибка загрузки данных пользователя');
            }
        }

        // Удаление пользователя
        async function deleteUser(userId, userName) {
            if (!confirm(`Вы уверены, что хотите удалить пользователя "${userName}"?`)) {
                return;
            }

            try {
                const response = await fetch(getApiUrl('UserController.php', 'action=delete'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: userId })
                });

                const result = await response.json();

                if (result.success) {
                    alert('Пользователь успешно удален');
                    loadUsers();
                } else {
                    alert('Ошибка: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Ошибка удаления пользователя');
            }
        }

        // Закрытие модального окна
        function closeUserModal() {
            document.getElementById('userModal').classList.remove('show');
            document.getElementById('userForm').reset();
            currentEditUserId = null;
        }

        // Отправка формы пользователя
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            // Удаляем пустой пароль при редактировании
            if (currentEditUserId && !data.password) {
                delete data.password;
            }

            const action = currentEditUserId ? 'update' : 'create';
            const submitBtn = document.getElementById('userSubmitBtn');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Сохранение...';

            try {
                const response = await fetch(getApiUrl('UserController.php', `action=${action}`), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    alert(currentEditUserId ? 'Данные обновлены' : 'Пользователь создан');
                    closeUserModal();
                    loadUsers();
                } else {
                    alert('Ошибка: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Ошибка соединения с сервером');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Сохранить';
            }
        });

        // Переключение секций
        function showSection(sectionName) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            
            document.getElementById(sectionName).classList.add('active');
            event.target.closest('.menu-item').classList.add('active');

            const titles = {
                'dashboard': 'Главная',
                'orders': 'Заказы',
                'users': 'Пользователи',
                'products': 'Товары'
            };

            document.getElementById('sectionTitle').textContent = titles[sectionName];

            if (sectionName === 'orders') {
                loadOrders();
            } else if (sectionName === 'users') {
                loadUsers();
            }
        }

        // Выход
        async function logout() {
            if (!confirm('Выйти из админ-панели?')) return;
            
            try {
                await fetch(getApiUrl('AuthController.php', 'action=logout'));
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Инициализация
        (async () => {
            const isAdmin = await checkAdmin();
            if (isAdmin) {
                loadStatistics();
            }
        })();
    </script>
</body>

</html>
