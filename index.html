<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Столовая - Главная</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/config.js"></script>
</head>

<body>
    <!-- Хедер -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <svg class="chef-hat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
                    <line x1="6" y1="17" x2="18" y2="17" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
            </a>

            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск в столовой">
            </div>

            <div class="header-right">
                <div class="location-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>ул. Павлова 41</span>
                </div>

                <a href="cart.html" class="header-btn cart-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>Корзина</span>
                    <span class="cart-count" id="cartBadge" style="display: none;">0</span>
                </a>

                <a href="profile.html" class="header-btn profile-btn" id="profileBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span id="profileText">Профиль</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Контент -->
    <div class="container">
        <!-- Секция "Скидки" -->
        <section class="section fade-in" id="discountSection">
            <div class="section-header">
                <h2 class="section-title">🔥 Скидки</h2>
                <a href="#catalog" class="view-all">Смотреть все →</a>
            </div>
            <div class="horizontal-scroll" id="discountProducts">
                <div class="loader"></div>
            </div>
        </section>

        <!-- Секция "Популярное" -->
        <section class="section fade-in">
            <div class="section-header">
                <h2 class="section-title">⭐ Популярное</h2>
                <a href="#catalog" class="view-all">Смотреть все →</a>
            </div>
            <div class="horizontal-scroll" id="popularProducts">
                <div class="loader"></div>
            </div>
        </section>

        <!-- Секция "Каталог" -->
        <section class="section fade-in" id="catalog">
            <div class="section-header">
                <h2 class="section-title">📋 Каталог</h2>
            </div>

            <!-- Фильтры -->
            <div class="category-filters" id="categoryFilters">
                <button class="filter-btn active" data-category="all">Все</button>
                <button class="filter-btn" data-category="hot">Горячее</button>
                <button class="filter-btn" data-category="soup">Супы</button>
                <button class="filter-btn" data-category="bakery">Выпечка</button>
                <button class="filter-btn" data-category="drink">Напитки</button>
                <button class="filter-btn" data-category="salad">Салаты</button>
                <button class="filter-btn" data-category="dessert">Десерты</button>
            </div>

            <!-- Сетка товаров -->
            <div class="products-grid" id="catalogProducts">
                <div class="loader" style="grid-column: 1/-1;"></div>
            </div>
        </section>
    </div>

    <script src="assets/js/cart.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
